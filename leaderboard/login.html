<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Log in | Conestoga Computer Science Club</title>
  <meta name="description"
    content="The Conestoga Computer Science Club seeks to further students' interest and understanding of Computer Science through enriching experiences. We hold weekly meetings and host contests, hackathons, and more! Stop by after school on Mondays in room 2005.">
  <meta name="theme-color" content="#eaaded">

  <!--CSS re-used across stogacs.club -->
  <link rel="stylesheet" href="/style/theme.css">
  <link rel="stylesheet" href="/style/navbar.css">
  <link rel="stylesheet" href="/style/leaderboard/leaderboard.css">

  <!-- Load in page specific CSS -->
  <link rel="stylesheet" href="/style/leaderboard/login.css">

  <!--Scripts re-used across stogacs.club -->
  <script src="/scripts/utils.js"></script>

  <!-- Load in page scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/scripts/leaderboard/supabase-config.js"></script>
  <script src="/scripts/leaderboard/shekels.js"></script>
  <script src="/scripts/leaderboard/login.js"></script>

  <!-- Load in external CSS Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />


</head>

<body>
  <header>
    <a href="/" class="navbar-title">Conestoga Computer Science Club</a>
    <input type="checkbox" id="navbar-click">
    <label for="navbar-click" class="navbar-toggle"><i class="fas fa-bars"></i></label>
    <ul id="navbar-links">
      <li><a href="/leaderboard/index.html">Back</a></li>
    </ul>
  </header>
  <section class="stack center-text center-form" class="screen pure-g">
      <div>
        <h1 class="center-text" id="page-title">Log in</h1>
      </div>

      <div id="account-card" class="login-cards" style="display: none;">
        <div class="card pure-g">
          <div class="card-content">
            <b id="account-name"></b>
            <p class="button-label">Username: <span id="account-username"></span></p>
            <p class="button-label">Shekels: <span id="account-shekels"></span></p>
            <div class="button-container">
              <button type="button" id="logout-button" class="pure-button">Log out</button>
            </div>
          </div>
        </div>

        <div class="card pure-g">
          <div class="card-content">
            <b class="center-text">Change display name</b>
            <form id="display-name-form" class="pure-form pure-form-stacked login-form">
              <input id="new-display-name" type="text" placeholder="New display name" maxlength="40" required>
              <p class="error-text" id="display-name-error" style="display: none;"></p>
              <p class="success-text" id="display-name-success" style="display: none;"></p>
              <button id="display-name-button" type="submit" class="pure-button pure-button-primary">Save display name</button>
            </form>
          </div>
        </div>

        <div class="card pure-g">
          <div class="card-content">
            <b class="center-text">Change password</b>
            <form id="password-form" class="pure-form pure-form-stacked login-form">
              <input id="current-password" type="password" placeholder="Current password"
                autocomplete="current-password" required>
              <input id="new-password" type="password" placeholder="New password (6+ characters)" minlength="6"
                autocomplete="new-password" required>
              <input id="new-password-confirm" type="password" placeholder="Confirm new password" minlength="6"
                autocomplete="new-password" required>
              <p class="error-text" id="password-error" style="display: none;"></p>
              <p class="success-text" id="password-success" style="display: none;"></p>
              <button id="password-button" type="submit" class="pure-button pure-button-primary">Change password</button>
            </form>
          </div>
        </div>
      </div>

      <div id="login-cards" class="login-cards" style="display: none;">
        <div class="card pure-g">
          <div class="card-content">
            <b class="center-text">Log in</b>
            <form id="login-form" class="pure-form pure-form-stacked login-form">
              <input id="login-username" type="text" placeholder="Username"
                autocomplete="username" required>
              <input id="login-password" type="password" placeholder="Password"
                autocomplete="current-password" required>
              <p class="error-text" id="login-error" style="display: none;"></p>
              <button id="login-button" type="submit" class="pure-button pure-button-primary">Log in</button>
            </form>
            <p class="button-label">Forgot your password? Ask a club officer to reset it.</p>
          </div>
        </div>

        <div class="card pure-g">
          <div class="card-content">
            <b class="center-text">Create an account</b>
            <form id="signup-form" class="pure-form pure-form-stacked login-form">
              <input id="signup-username" type="text" placeholder="Name + grad year, e.g. JohnDoe27"
                pattern="[A-Za-z]+[0-9]{2}" title="Your full name followed by your two digit graduation year"
                autocomplete="username" required>
              <input id="signup-display-name" type="text" placeholder="Display name" maxlength="40" required>
              <input id="signup-password" type="password" placeholder="Password (6+ characters)" minlength="6"
                autocomplete="new-password" required>
              <input id="signup-password-confirm" type="password" placeholder="Confirm password" minlength="6"
                autocomplete="new-password" required>
              <p class="error-text" id="signup-error" style="display: none;"></p>
              <button id="signup-button" type="submit" class="pure-button pure-button-primary">Create account</button>
            </form>
          </div>
        </div>
      </div>
  </section>
</body>
